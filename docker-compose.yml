services:

  backend:
    build:
      context: ./backend

    container_name: rag-backend

    env_file:
      - ./backend/.env

    ports:
      - "5000:5000"

    restart: unless-stopped


  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000

    container_name: rag-frontend

    ports:
      - "3000:3000"

    depends_on:
      - backend

    restart: unless-stopped